<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Thiago Soethe</title>
  <desc id="desc">Estudante de Análise e Desenvolvimento de Sistemas com interesse em desenvolvimento web, software e banco de dados.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="0.52" stop-color="#0b2854"/>
      <stop offset="1" stop-color="#0b4380"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8cc8ff" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8bd5ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1070" cy="55" r="230" fill="url(#glow)"/>
  <circle cx="1080" cy="80" r="116" fill="none" stroke="#8bd5ff" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="1080" cy="80" r="72" fill="none" stroke="#8bd5ff" stroke-opacity=".14"/>

  <g transform="translate(72 65)">
    <rect x="0" y="0" width="48" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="82" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-.8">Thiago Soethe</text>
    <text x="2" y="132" fill="#b9d9f7" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">Análise e Desenvolvimento de Sistemas</text>
    <text x="2" y="177" fill="#8fb5d9" font-family="Segoe UI, Arial, sans-serif" font-size="18">Desenvolvimento web  •  Software  •  Banco de dados</text>
  </g>

  <g transform="translate(1018 218)" fill="none" stroke="#d7ecff" stroke-linecap="round" stroke-linejoin="round" stroke-width="8" opacity=".88">
    <path d="M-32-25-62 0l30 25M32-25 62 0 32 25M13-42-13 42"/>
  </g>
</svg>
